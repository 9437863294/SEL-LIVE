apply plugin: 'com.android.application'

// ── Release signing ────────────────────────────────────────────────────────────
// The keystore is never committed. CI writes it from a secret and passes the
// passwords as environment variables; a machine without it still configures and
// builds (producing an *unsigned* release APK) rather than failing the whole
// project, so `assembleDebug` keeps working for anyone without the signing
// material.
def resolveSigningValue = { String envName, String propertyName ->
    System.getenv(envName) ?: project.findProperty(propertyName)
}
def keystorePath = resolveSigningValue('ANDROID_KEYSTORE_PATH', 'RELEASE_STORE_FILE')
def releaseKeystore = keystorePath ? file(keystorePath) : null
def hasReleaseKeystore = releaseKeystore != null && releaseKeystore.exists()

if (!hasReleaseKeystore) {
    logger.lifecycle("No release keystore configured (ANDROID_KEYSTORE_PATH); release builds will be unsigned.")
}

android {
    namespace = "com.sel"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable from CI (`-PversionCodeOverride=… -PversionNameOverride=…`) so a release can be
        // cut without a commit, while a local build keeps the checked-in values.
        // Assignments, not command calls: `versionCode (x) as Integer` parses as `(versionCode(x)) as Integer`
        // and hands the string to versionCode, which failed the configuration ("Value is null").
        // Default versionCode is date-based (yyyymmddNN), so a build without overrides is never a
        // downgrade of an APK already on a phone. 1.2: the native background trip recorder.
        versionCode = Integer.parseInt(String.valueOf(project.findProperty('versionCodeOverride') ?: '2026102601'))
        versionName = String.valueOf(project.findProperty('versionNameOverride') ?: '1.2')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystore
                storePassword resolveSigningValue('ANDROID_KEYSTORE_PASSWORD', 'RELEASE_STORE_PASSWORD')
                keyAlias resolveSigningValue('ANDROID_KEY_ALIAS', 'RELEASE_KEY_ALIAS')
                keyPassword resolveSigningValue('ANDROID_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
