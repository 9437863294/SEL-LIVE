# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # A single instance served every user, so concurrent sign-ins queued behind one
  # another and every cold start was felt app-wide.
  maxInstances: 5
  minInstances: 1
  concurrency: 80

env:
  # ── Public application URL (used in authentication emails) ──────────
  - variable: APP_BASE_URL
    value: https://seltech.store
    availability:
      - RUNTIME

  # ── SMTP (Nodemailer) ───────────────────────────────────────────────
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: data.management@selindia.net
    availability:
      - RUNTIME
  - variable: SMTP_FROM_NAME
    value: Siddhartha Engineering Limited
    availability:
      - RUNTIME
  - variable: SMTP_FROM_EMAIL
    value: data.management@selindia.net
    availability:
      - RUNTIME
  - variable: SMTP_PASS
    secret: smtp-pass
    availability:
      - RUNTIME

  # ── reCAPTCHA v2 ───────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdVhlstAAAAAK7cn8oFprUVIJkTWQyhGbdqb9l_
    availability:
      - BUILD

  - variable: RECAPTCHA_SECRET_KEY
    value: 6LdVhlstAAAAAJIF5o1b8Z6--r-yNPN2340HizCs
    availability:
      - RUNTIME

  # ── Firebase Cloud Messaging (web push) ─────────────────────────────
  # Public key half of the Web Push VAPID pair (Console > Project settings >
  # Cloud Messaging > Web Push certificates). Public by design — it ships to the
  # browser — so a plain value rather than a secret, same as the reCAPTCHA site key.
  #
  # BUILD, not RUNTIME: Next.js inlines NEXT_PUBLIC_* at build time, so a runtime-only
  # value would be undefined in the browser and web push would silently stay off.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BGupBUFchPYG27fXZr9-3ElK5uD1kP8-MXbS5DWEcS5DSQ_hgXQnQO_OwFmBvHJ7wUxvG7QTKtFjz8mKB6hSKG8
    availability:
      - BUILD

  # ── Firebase Admin SDK (server-side routes) ─────────────────────────
  - variable: FIREBASE_PROJECT_ID
    secret: firebase-project-id
    availability:
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: firebase-client-email
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: LOCATION_TRACKING_ADMIN_PASSWORD_HASH
    secret: location-tracking-admin-password-hash
    availability:
      - RUNTIME

  # ── Office Hub → Google Meet (docs/office-hub.md §14) ───────────────
  #
  # Deliberately NOT declared here. Its three variables live in the App Hosting
  # backend's own environment configuration (Firebase console → App Hosting →
  # your backend → Environment), alongside GREYTHR_*, GEMINI_API_KEY and the
  # Firebase client keys:
  #
  #   GOOGLE_OAUTH_CLIENT_ID        109112310488-…apps.googleusercontent.com
  #   GOOGLE_OAUTH_CLIENT_SECRET    GOCSPX-…
  #   OFFICE_HUB_GOOGLE_TOKEN_KEY   32 random bytes, base64
  #
  # Why not here: a `secret:` reference in this file must resolve at build time,
  # so declaring one for a secret that does not exist yet fails the *entire*
  # deployment at the preparer step — which is what happened on 18–19 Sep 2026.
  # Google Meet is an optional integration: `googleMeetConfigured()` returns
  # false when these are absent, the Settings card says so, and online meetings
  # fall back to a pasted joining link. Coupling the whole app's deployability to
  # it was the wrong trade, so the variables are configured where they can be
  # added and changed without a deploy.
  #
  # The redirect URI is derived from APP_BASE_URL above and resolves to
  # https://seltech.store/api/office-hub/google/callback — that exact string must
  # be registered on the OAuth client, or consent fails *after* the user approves
  # it, with redirect_uri_mismatch.
  #
  # OFFICE_HUB_GOOGLE_TOKEN_KEY encrypts the stored Google refresh tokens. Keep
  # it: rotating it does not break the app, but it makes every stored token
  # unreadable, so every organizer must reconnect Google.