# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # A single instance served every user, so concurrent sign-ins queued behind one
  # another and every cold start was felt app-wide.
  maxInstances: 5
  minInstances: 1
  concurrency: 80

env:
  # ── Public application URL (used in authentication emails) ──────────
  - variable: APP_BASE_URL
    value: https://seltech.store
    availability:
      - RUNTIME

  # ── SMTP (Nodemailer) ───────────────────────────────────────────────
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: data.management@selindia.net
    availability:
      - RUNTIME
  - variable: SMTP_FROM_NAME
    value: Siddhartha Engineering Limited
    availability:
      - RUNTIME
  - variable: SMTP_FROM_EMAIL
    value: data.management@selindia.net
    availability:
      - RUNTIME
  - variable: SMTP_PASS
    secret: smtp-pass
    availability:
      - RUNTIME

  # ── reCAPTCHA v2 ───────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdVhlstAAAAAK7cn8oFprUVIJkTWQyhGbdqb9l_
    availability:
      - BUILD

  - variable: RECAPTCHA_SECRET_KEY
    value: 6LdVhlstAAAAAJIF5o1b8Z6--r-yNPN2340HizCs
    availability:
      - RUNTIME

  # ── Firebase Cloud Messaging (web push) ─────────────────────────────
  # Public key half of the Web Push VAPID pair (Console > Project settings >
  # Cloud Messaging > Web Push certificates). Public by design — it ships to the
  # browser — so a plain value rather than a secret, same as the reCAPTCHA site key.
  #
  # BUILD, not RUNTIME: Next.js inlines NEXT_PUBLIC_* at build time, so a runtime-only
  # value would be undefined in the browser and web push would silently stay off.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BGupBUFchPYG27fXZr9-3ElK5uD1kP8-MXbS5DWEcS5DSQ_hgXQnQO_OwFmBvHJ7wUxvG7QTKtFjz8mKB6hSKG8
    availability:
      - BUILD

  # ── Firebase Admin SDK (server-side routes) ─────────────────────────
  - variable: FIREBASE_PROJECT_ID
    secret: firebase-project-id
    availability:
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: firebase-client-email
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: LOCATION_TRACKING_ADMIN_PASSWORD_HASH
    secret: location-tracking-admin-password-hash
    availability:
      - RUNTIME

  # ── Office Hub → Google Meet (docs/office-hub.md §14) ───────────────
  # Office Hub creates the Meet link and the Google Calendar event for every
  # online meeting. The redirect URI is derived from APP_BASE_URL above, so it
  # resolves to https://seltech.store/api/office-hub/google/callback — that exact
  # string must be registered on the OAuth client or consent fails *after* the
  # user has approved it, with redirect_uri_mismatch.
  #
  # RUNTIME, not BUILD: all three are read server-side in the API routes. None is
  # a NEXT_PUBLIC_* value, and none may ever become one — see below.
  #
  # The client ID is not a secret (it identifies the app, and in a normal OAuth
  # flow it travels through the browser), so it is a plain value like the
  # reCAPTCHA site key. The other two are secrets and are stored in Secret
  # Manager, because this file is committed to git.
  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: 109112310488-1n8s5ltrs9f5mv385r120vhcu9rjne4k.apps.googleusercontent.com
    availability:
      - RUNTIME

  # Create with:
  #   firebase apphosting:secrets:set google-oauth-client-secret
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: google-oauth-client-secret
    availability:
      - RUNTIME

  # Encrypts the stored Google refresh tokens (AES-256-GCM, 32 bytes base64).
  # Generate and store with:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  #   firebase apphosting:secrets:set office-hub-google-token-key
  #
  # Use a *different* key from the local .env one, and keep it. Rotating it does
  # not break the app, but it makes every stored token unreadable, so every
  # organizer has to reconnect Google before their meetings get Meet links again.
  - variable: OFFICE_HUB_GOOGLE_TOKEN_KEY
    secret: office-hub-google-token-key
    availability:
      - RUNTIME